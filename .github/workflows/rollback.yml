name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version to rollback to (e.g., v20240125-abc1234)'
        required: true
        type: string
      environment:
        description: 'Environment to rollback'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      confirm_rollback:
        description: 'Type "CONFIRM" to proceed with rollback'
        required: true
        type: string

jobs:
  validate-inputs:
    name: Validate Rollback Inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      proceed: ${{ steps.validate.outputs.proceed }}
    
    steps:
      - name: Validate inputs
        id: validate
        run: |
          if [ "${{ github.event.inputs.confirm_rollback }}" != "CONFIRM" ]; then
            echo "❌ Rollback confirmation failed. Please type 'CONFIRM' to proceed."
            exit 1
          fi
          
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^(v|dev-)[0-9]{8}-[a-f0-9]{7}$ ]]; then
            echo "❌ Invalid version format. Expected format: v20240125-abc1234 or dev-20240125-abc1234"
            exit 1
          fi
          
          echo "✅ Validation passed for version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "proceed=true" >> $GITHUB_OUTPUT

  check-image-exists:
    name: Verify Docker Image Exists
    needs: validate-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: needs.validate-inputs.outputs.proceed == 'true'
    
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@62216b50636a8c8c25d246437857ed84232019ca
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Check if image exists
        run: |
          VERSION="$VERSION"
          IMAGE="$DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO_NAME:$VERSION"
          
          echo "🔍 Checking if image exists: $IMAGE"
          
          if docker manifest inspect $IMAGE > /dev/null 2>&1; then
            echo "✅ Image found: $IMAGE"
          else
            echo "❌ Image not found: $IMAGE"
            echo "Available tags:"
            curl -s "https://hub.docker.com/v2/repositories/$DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO_NAME/tags/?page_size=10" | grep -o '"name":"[^"]*"' | cut -d'"' -f4 | head -10
            exit 1
          fi
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_REPO_NAME: ${{ github.event.inputs.environment == 'staging' && secrets.DOCKER_HUB_STAGING_REPO_NAME || secrets.DOCKER_HUB_REPO_NAME }}

  rollback:
    name: Execute Rollback
    needs: [validate-inputs, check-image-exists]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: needs.validate-inputs.outputs.proceed == 'true'
    
    steps:
      - name: Create backup of current deployment
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ github.event.inputs.environment == 'staging' && secrets.SSH_STAGING_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USERNAME }}/app
            echo "📋 Creating backup of current deployment..."
            
            if [ -f .env ]; then
              CURRENT_VERSION=$(grep "CURRENT_VERSION=" .env | cut -d'=' -f2)
              echo "Current version: $CURRENT_VERSION"
              
              echo "BACKUP_VERSION=$CURRENT_VERSION" > .env.backup
              echo "BACKUP_DATE=$(date)" >> .env.backup
            else
              echo "No current version found"
            fi

      - name: Execute rollback deployment
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ github.event.inputs.environment == 'staging' && secrets.SSH_STAGING_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: VERSION,DOCKER_HUB_USERNAME,DOCKER_HUB_REPO_NAME,DOCKER_HUB_ACCESS_TOKEN,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,SUPABASE_URL,OTEL_EXPORTER_OTLP_ENDPOINT,OTEL_LOGS_ENDPOINT,LOKI_PUSH_URL
          script: |
            set -e
            cd /home/${{ secrets.SSH_USERNAME }}/app
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            IMAGE="$DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO_NAME:$VERSION"
            
            echo "🔄 Starting rollback to version: $VERSION"
            
            echo "$DOCKER_HUB_ACCESS_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
            
            echo "📥 Pulling image: $IMAGE"
            docker pull $IMAGE

            # Preserve existing DB credentials when available to avoid DB auth drift
            # with persistent postgres volume.
            EXISTING_POSTGRES_DB=""
            EXISTING_POSTGRES_USER=""
            EXISTING_POSTGRES_PASSWORD=""
            if [ -f .env ]; then
              EXISTING_POSTGRES_DB="$(grep '^POSTGRES_DB=' .env | cut -d'=' -f2- || true)"
              EXISTING_POSTGRES_USER="$(grep '^POSTGRES_USER=' .env | cut -d'=' -f2- || true)"
              EXISTING_POSTGRES_PASSWORD="$(grep '^POSTGRES_PASSWORD=' .env | cut -d'=' -f2- || true)"
            fi
            POSTGRES_DB_VALUE="${EXISTING_POSTGRES_DB:-$POSTGRES_DB}"
            POSTGRES_USER_VALUE="${EXISTING_POSTGRES_USER:-$POSTGRES_USER}"
            POSTGRES_PASSWORD_VALUE="${EXISTING_POSTGRES_PASSWORD:-$POSTGRES_PASSWORD}"

            cat > .env << EOL
            POSTGRES_DB=$POSTGRES_DB_VALUE
            POSTGRES_USER=$POSTGRES_USER_VALUE
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD_VALUE
            SUPABASE_URL=$SUPABASE_URL
            OTEL_EXPORTER_OTLP_ENDPOINT=$OTEL_EXPORTER_OTLP_ENDPOINT
            OTEL_LOGS_ENDPOINT=$OTEL_LOGS_ENDPOINT
            LOKI_PUSH_URL=$LOKI_PUSH_URL
            DOCKER_HUB_USERNAME=$DOCKER_HUB_USERNAME
            DOCKER_HUB_REPO_NAME=$DOCKER_HUB_REPO_NAME
            IMAGE_TAG=$VERSION
            CURRENT_VERSION=$VERSION
            EOL

            echo "🔄 Recreating app and alloy only (keeping db/redis running)"
            docker compose up -d --no-deps --force-recreate app alloy
            docker ps
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_REPO_NAME: ${{ github.event.inputs.environment == 'staging' && secrets.DOCKER_HUB_STAGING_REPO_NAME || secrets.DOCKER_HUB_REPO_NAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_LOGS_ENDPOINT: ${{ secrets.OTEL_LOGS_ENDPOINT }}
          LOKI_PUSH_URL: ${{ secrets.LOKI_PUSH_URL }}

  health-check:
    name: Post-Rollback Health Check
    needs: [validate-inputs, rollback]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: needs.validate-inputs.outputs.proceed == 'true'
    
    steps:
      - name: Verify service health
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ github.event.inputs.environment == 'staging' && secrets.SSH_STAGING_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.SSH_USERNAME }}/app
            echo "🏥 Performing health check..."
            
            sleep 20
            
            if docker compose ps --status running app | grep -q app; then
              echo "✅ App service container is running"
            else
              echo "❌ App service container is not running"
              docker compose ps
              docker compose logs --tail=200 app
              exit 1
            fi
            
            echo "🔍 Testing service endpoint..."
            if curl -f -s http://localhost:8080/actuator/health; then
              echo "✅ Service is responding to HTTP requests"
            else
              echo "❌ Health endpoint check failed"
              docker compose logs --tail=200 app
              exit 1
            fi
            
            echo "📊 Final status:"
            docker compose ps
            
            VERSION="${{ needs.validate-inputs.outputs.version }}"
            echo "🎉 Rollback to version $VERSION completed successfully!"

  notify-rollback:
    name: Notify Rollback Status
    needs: [validate-inputs, rollback, health-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: always() && needs.validate-inputs.outputs.proceed == 'true'
    
    steps:
      - name: Create rollback summary
        run: |
          VERSION="${{ needs.validate-inputs.outputs.version }}"
          ENV="${{ github.event.inputs.environment }}"
          
          if [ "${{ needs.health-check.result }}" == "success" ]; then
            STATUS="✅ SUCCESS"
            MESSAGE="Rollback to version $VERSION completed successfully"
          else
            STATUS="❌ FAILED"
            MESSAGE="Rollback to version $VERSION failed"
          fi
          
          echo "## Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** $ENV" >> $GITHUB_STEP_SUMMARY
          echo "- **Initiated by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$MESSAGE" >> $GITHUB_STEP_SUMMARY
