name: Deploy

on:
  workflow_run:
    workflows: [ "CI - Build Test Coverage Sonar" ] # this usually takes the longest
    types:
      - completed
    branches: [main]

jobs:
  check-workflow-status:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      all_success: ${{ steps.check-status.outputs.all_success }}
    steps:
      - name: Check required workflows on triggering commit
        id: check-required
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${HEAD_SHA:-}" ]; then
            echo "Missing workflow_run head_sha"
            echo "all_success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REQUIRED_WORKFLOWS=("linter.yml" "scorecard.yml" "sonarcloud.yml")
          ALL_SUCCESS=true

          for WORKFLOW_FILE in "${REQUIRED_WORKFLOWS[@]}"; do
            API_URL="https://api.github.com/repos/${REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?head_sha=${HEAD_SHA}&status=completed&per_page=1"
            RESPONSE="$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL")"
            CONCLUSION="$(echo "$RESPONSE" | jq -r '.workflow_runs[0].conclusion // "none"')"
            EVENT="$(echo "$RESPONSE" | jq -r '.workflow_runs[0].event // "none"')"
            RUN_ID="$(echo "$RESPONSE" | jq -r '.workflow_runs[0].id // "none"')"

            echo "${WORKFLOW_FILE}: conclusion=${CONCLUSION}, event=${EVENT}, run_id=${RUN_ID}"

            if [ "$CONCLUSION" != "success" ]; then
              ALL_SUCCESS=false
            fi
          done

          echo "all_success=${ALL_SUCCESS}" >> "$GITHUB_OUTPUT"

      - name: Verify all workflows succeeded
        id: check-status
        run: |
          if [[ "${{ steps.check-required.outputs.all_success }}" == "true" ]]; then
            echo "all_success=true" >> $GITHUB_OUTPUT
          else
            echo "all_success=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: check-workflow-status
    if: ${{ needs.check-workflow-status.outputs.all_success == 'true' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate immutable image tag
        id: image-tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE_TAG="$(date -u +%Y%m%d)"
          VERSION_TAG="v${DATE_TAG}-${SHORT_SHA}"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $VERSION_TAG"
      - name: Log in to Docker Hub
        uses: docker/login-action@62216b50636a8c8c25d246437857ed84232019ca
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@c382f710d39a5bb4e430307530a720f50c2d3318
        with:
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_NAME }}:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_NAME }}:${{ steps.image-tag.outputs.version_tag }}
      - name: Copy docker-compose.yml and Dockerfile to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.SSH_USERNAME }}/app"
      - name: Releasing New Version
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOCKER_HUB_ACCESS_TOKEN,DOCKER_HUB_USERNAME,DOCKER_HUB_REPO_NAME,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,SUPABASE_URL,OTEL_EXPORTER_OTLP_ENDPOINT,OTEL_LOGS_ENDPOINT,LOKI_PUSH_URL,VERSION_TAG
          script: |
            cd /home/${{ secrets.SSH_USERNAME }}/app
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            docker compose down || true
            echo "$DOCKER_HUB_ACCESS_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
            docker pull "$DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO_NAME:$VERSION_TAG"
            cat > .env << EOL
            POSTGRES_DB=$POSTGRES_DB
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            SUPABASE_URL=$SUPABASE_URL
            OTEL_EXPORTER_OTLP_ENDPOINT=$OTEL_EXPORTER_OTLP_ENDPOINT
            OTEL_LOGS_ENDPOINT=$OTEL_LOGS_ENDPOINT
            LOKI_PUSH_URL=$LOKI_PUSH_URL
            DOCKER_HUB_USERNAME=$DOCKER_HUB_USERNAME
            DOCKER_HUB_REPO_NAME=$DOCKER_HUB_REPO_NAME
            IMAGE_TAG=$VERSION_TAG
            CURRENT_VERSION=$VERSION_TAG
            EOL
            docker compose up -d
            docker ps
        env:
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_REPO_NAME: ${{ secrets.DOCKER_HUB_REPO_NAME }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_LOGS_ENDPOINT: ${{ secrets.OTEL_LOGS_ENDPOINT }}
          LOKI_PUSH_URL: ${{ secrets.LOKI_PUSH_URL }}
          VERSION_TAG: ${{ steps.image-tag.outputs.version_tag }}
