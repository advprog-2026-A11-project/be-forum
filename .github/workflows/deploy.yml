name: Deploy

on:
  workflow_run:
    workflows: [ "CI - Build Test Coverage Sonar" ] # this usually takes the longest
    types:
      - completed
    branches: [main]
  

jobs:
  check-workflow-status:
    runs-on: ubuntu-latest
    outputs:
      all_success: ${{ steps.check-status.outputs.all_success }}
    steps:
      - name: Check status of linter.yml
        id: check-lint
        run: |
          set -e
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/linter.yml/runs?branch=main&event=push&status=completed&per_page=1"
          CONCLUSION=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL" | jq -r '.workflow_runs[0].conclusion // "none"')
          echo "Latest linter conclusion: $CONCLUSION"
          if [ "$CONCLUSION" = "success" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}

      - name: Check status of scorecard.yml
        id: check-scorecard
        run: |
          set -e
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/scorecard.yml/runs?branch=main&event=push&status=completed&per_page=1"
          CONCLUSION=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL" | jq -r '.workflow_runs[0].conclusion // "none"')
          echo "Latest scorecard conclusion: $CONCLUSION"
          if [ "$CONCLUSION" = "success" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}

      - name: Check status of sonarcloud.yml
        id: check-sonar
        run: |
          set -e
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/sonarcloud.yml/runs?branch=main&event=push&status=completed&per_page=1"
          CONCLUSION=$(curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$API_URL" | jq -r '.workflow_runs[0].conclusion // "none"')
          echo "Latest sonarcloud conclusion: $CONCLUSION"
          if [ "$CONCLUSION" = "success" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}

      - name: Verify all workflows succeeded
        id: check-status
        run: |
          if [[ "${{ steps.check-lint.outputs.result }}" == "true" && \
               "${{ steps.check-scorecard.outputs.result }}" == "true" && \
               "${{ steps.check-sonar.outputs.result }}" == "true" ]]; then
            echo "all_success=true" >> $GITHUB_OUTPUT
          else
            echo "all_success=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: check-workflow-status
    if: ${{ needs.check-workflow-status.outputs.all_success == 'true' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate immutable image tag
        id: image-tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE_TAG="$(date -u +%Y%m%d)"
          VERSION_TAG="v${DATE_TAG}-${SHORT_SHA}"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $VERSION_TAG"
      - name: Log in to Docker Hub
        uses: docker/login-action@62216b50636a8c8c25d246437857ed84232019ca
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@c382f710d39a5bb4e430307530a720f50c2d3318
        with:
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_NAME }}:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_NAME }}:${{ steps.image-tag.outputs.version_tag }}
      - name: Copy docker-compose.yml and Dockerfile to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.SSH_USERNAME }}/app"
      - name: Releasing New Version
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOCKER_HUB_ACCESS_TOKEN,DOCKER_HUB_USERNAME,DOCKER_HUB_REPO_NAME,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,SUPABASE_URL,OTEL_EXPORTER_OTLP_ENDPOINT,OTEL_LOGS_ENDPOINT,VERSION_TAG
          script: |
            cd /home/${{ secrets.SSH_USERNAME }}/app
            docker compose down || true
            echo "$DOCKER_HUB_ACCESS_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
            docker pull "$DOCKER_HUB_USERNAME/$DOCKER_HUB_REPO_NAME:$VERSION_TAG"
            cat > .env << EOL
            POSTGRES_DB=$POSTGRES_DB
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            SUPABASE_URL=$SUPABASE_URL
            OTEL_EXPORTER_OTLP_ENDPOINT=$OTEL_EXPORTER_OTLP_ENDPOINT
            OTEL_LOGS_ENDPOINT=$OTEL_LOGS_ENDPOINT
            DOCKER_HUB_USERNAME=$DOCKER_HUB_USERNAME
            DOCKER_HUB_REPO_NAME=$DOCKER_HUB_REPO_NAME
            IMAGE_TAG=$VERSION_TAG
            CURRENT_VERSION=$VERSION_TAG
            EOL
            docker compose up -d
            docker ps
        env:
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_REPO_NAME: ${{ secrets.DOCKER_HUB_REPO_NAME }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_LOGS_ENDPOINT: ${{ secrets.OTEL_LOGS_ENDPOINT }}
          VERSION_TAG: ${{ steps.image-tag.outputs.version_tag }}
