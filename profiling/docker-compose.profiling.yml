services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beforum_profiling}
      POSTGRES_USER: ${POSTGRES_USER:-beforum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${PROFILING_DB_PORT:-55432}:5432"
    volumes:
      - beforum-profiling-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beforum} -d ${POSTGRES_DB:-beforum_profiling}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "${PROFILING_REDIS_PORT:-56379}:6379"
    volumes:
      - beforum-profiling-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-beforum_profiling}
      - DB_USERNAME=${POSTGRES_USER:-beforum}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - AUTH_BACKEND_URL=${AUTH_BACKEND_URL:-http://host.docker.internal:8081}
      - SUPABASE_URL=${SUPABASE_URL:-http://localhost:9999}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    ports:
      - "${PROFILING_APP_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  beforum-profiling-db-data:
  beforum-profiling-redis-data:
