spring.application.name=be-forum
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/beforum}
spring.datasource.username=${DB_USERNAME:beforum}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=none
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_URL}/auth/v1
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.audiences=authenticated

# Actuator / Monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# Service identity used in metrics/traces
management.opentelemetry.resource-attributes.service.name=${OTEL_SERVICE_NAME:${spring.application.name}}
management.opentelemetry.resource-attributes.deployment.environment=${OTEL_ENVIRONMENT:local}

# Export traces and metrics to external OpenTelemetry Collector
management.otlp.tracing.endpoint=${OTEL_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces}
management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics}
management.otlp.logging.endpoint=${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
management.otlp.logging.export.enabled=true
management.otlp.logs.export.enabled=true
management.otlp.logs.export.url=${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}

# Sampling ratio for tracing
management.tracing.sampling.probability=${OTEL_TRACE_SAMPLING_PROBABILITY:1.0}

# Correlate logs with traces in Grafana/Loki
logging.pattern.level=trace_id=%mdc{traceId} span_id=%mdc{spanId} trace_flags=%mdc{traceFlags} %5p

# Add an application tag to all metrics for dashboard filtering
management.metrics.tags.application=${spring.application.name}
