services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beforum}
      POSTGRES_USER: ${POSTGRES_USER:-beforum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    expose:
      - "5432"
    volumes:
      - beforum-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beforum} -d ${POSTGRES_DB:-beforum}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - beforum-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-beforum}
      - DB_USERNAME=${POSTGRES_USER:-beforum}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - AUTH_BACKEND_URL=${AUTH_BACKEND_URL:-http://localhost:8081}
      - SUPABASE_URL=${SUPABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - OTEL_SERVICE_NAME=be-forum
      - OTEL_ENVIRONMENT=${OTEL_ENVIRONMENT:-dev}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      - OTEL_LOGS_ENDPOINT=${OTEL_LOGS_ENDPOINT:-http://host.docker.internal:4318/v1/logs}
      - OTEL_TRACE_SAMPLING_PROBABILITY=${OTEL_TRACE_SAMPLING_PROBABILITY:-1.0}
      - OTEL_JAVA_GLOBAL_AUTOCONFIGURE_ENABLED=true
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${OTEL_LOGS_ENDPOINT:-http://host.docker.internal:4318/v1/logs}
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  log-shipper:
    image: otel/opentelemetry-collector-contrib:latest
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      - OTEL_ENVIRONMENT=${OTEL_ENVIRONMENT:-dev}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
    volumes:
      - ./observability/log-shipper-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  beforum-db-data:
  beforum-redis-data:
