services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beforum}
      POSTGRES_USER: ${POSTGRES_USER:-beforum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    expose:
      - "5432"
    volumes:
      - beforum-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beforum} -d ${POSTGRES_DB:-beforum}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - beforum-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-beforum}
      - DB_USERNAME=${POSTGRES_USER:-beforum}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-password}
      - AUTH_BACKEND_URL=${AUTH_BACKEND_URL:-http://localhost:8081}
      - SUPABASE_URL=${SUPABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - OTEL_SERVICE_NAME=be-forum
      - OTEL_ENVIRONMENT=${OTEL_ENVIRONMENT:-dev}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      - OTEL_TRACE_SAMPLING_PROBABILITY=${OTEL_TRACE_SAMPLING_PROBABILITY:-1.0}
      - OTEL_JAVA_GLOBAL_AUTOCONFIGURE_ENABLED=true
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    ports:
      - "8083:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alloy:
    image: grafana/alloy:latest
    command: ["run", "/etc/alloy/config.alloy"]
    environment:
      - OTEL_ENVIRONMENT=${OTEL_ENVIRONMENT:-dev}
      - LOKI_PUSH_URL=${LOKI_PUSH_URL:-http://host.docker.internal:3100/loki/api/v1/push}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_started

volumes:
  beforum-db-data:
  beforum-redis-data:
